<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんりしゃ画面｜せいかつクエスト</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f8f9fc; --line:#dde2ec; --line2:#c7cfdd;
  --txt:#26303f; --sub:#7a869c;
  --gold:#f0a92c; --gold-d:#b97a10;
  --green:#2fa85a; --green-d:#1d7a40;
  --blue:#3d82d8; --blue-d:#2a5d9e;
  --red:#e04b5c; --red-d:#a92b3a;
  --shadow:0 2px 6px rgba(38,48,63,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--txt);
  font-family:'Hiragino Sans','Yu Gothic UI',system-ui,sans-serif; font-size:15px; padding-bottom:40px}
img{image-rendering:pixelated}
code{background:#eef1f7; padding:1px 5px; border-radius:3px; font-size:12px}
pre{background:#20293a; color:#e8eefc; padding:12px; border-radius:8px; overflow:auto; font-size:12px; line-height:1.7}
a{color:var(--blue-d)}
.topbar{position:sticky; top:0; z-index:30; background:#fff; border-bottom:2px solid var(--line);
  padding:11px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  box-shadow:0 1px 4px rgba(38,48,63,.06)}
.brand{font-size:19px; letter-spacing:1px; white-space:nowrap; color:#1d2735}
.topright{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--sub)}
.dot{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:12px;
  background:#eef1f7; border:1px solid var(--line2)}
.dot i{width:9px; height:9px; border-radius:50%; background:#b6bfd0; display:block}
.dot.on{background:#e3f5e8; border-color:#a8dcbb; color:#1d7a40}
.dot.on i{background:var(--green)}
.dot.off{background:#ffe9ec; border-color:#f3b8c0; color:#a92b3a}
.dot.off i{background:var(--red)}
select,input,textarea{font-family:inherit; font-size:14px; color:var(--txt); background:#fff;
  border:2px solid var(--line2); border-radius:6px; padding:7px 9px; max-width:100%}
select:focus,input:focus,textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(61,130,216,.15)}
input[type=number]{width:94px}
.btn{font-family:inherit; font-size:13.5px; cursor:pointer; color:#fff; background:var(--blue);
  border:none; border-radius:6px; padding:9px 14px; box-shadow:0 2px 0 var(--blue-d); transition:.05s}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn.ok{background:var(--green); box-shadow:0 2px 0 var(--green-d)}
.btn.ng{background:var(--red); box-shadow:0 2px 0 var(--red-d)}
.btn.gold{background:var(--gold); box-shadow:0 2px 0 var(--gold-d)}
.btn.sub{background:#fff; color:var(--txt); border:2px solid var(--line2); box-shadow:0 2px 0 var(--line2)}
.btn.sm{font-size:12.5px; padding:7px 11px}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.linka{display:inline-block; text-decoration:none; font-size:12.5px; padding:7px 11px; border-radius:6px;
  background:#fff; color:var(--txt); border:2px solid var(--line2); box-shadow:0 2px 0 var(--line2)}
.tabs{position:sticky; top:57px; z-index:29; display:flex; gap:6px; padding:9px 14px; background:#eef1f7;
  border-bottom:2px solid var(--line); overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{font-family:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; background:#fff;
  color:var(--sub); border:2px solid var(--line2); border-radius:6px; padding:9px 15px}
.tab.on{background:var(--blue); color:#fff; border-color:var(--blue)}
.cnt{display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; border-radius:10px;
  background:var(--red); color:#fff; font-size:12px; text-align:center}
.cnt.zero{background:#b6bfd0}
.tab.on .cnt.zero{background:rgba(255,255,255,.35)}
main{padding:16px; max-width:1080px; margin:0 auto}
.card{background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:16px;
  margin-bottom:16px; box-shadow:var(--shadow)}
.card h2{margin:0 0 13px; font-size:16.5px; color:#1d2735; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.row{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:11px}
.row label{font-size:13px; color:var(--sub); min-width:76px}
.hint{font-size:12px; color:var(--sub); line-height:1.85; font-weight:normal}
.owner{display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:12px;
  background:#e5eefb; color:#2a5d9e; border:1px solid #aecbee; font-weight:normal}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.empty{color:var(--sub); font-size:13px; padding:18px 0; text-align:center;
  border:2px dashed var(--line2); border-radius:8px; background:#fafbfd}
.kb{display:inline-block; font-size:11.5px; font-weight:bold; padding:3px 10px; border-radius:12px}
.kb-daily{background:#e3f5e8; color:#1d7a40; border:1px solid #a8dcbb}
.kb-normal{background:#e5eefb; color:#2a5d9e; border:1px solid #aecbee}
.kb-special{background:linear-gradient(180deg,#fff3cf,#ffe19a); color:#8a5c0d; border:1px solid #e8bf58}
.st{display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:12px;
  background:#eef1f7; color:#65718a; border:1px solid var(--line2)}
.st.pending{background:#fff3d9; color:#a06a06; border-color:#f0cf8a}
.st.done{background:#e3f5e8; color:#1d7a40; border-color:#a8dcbb}
.st.arch{background:#f0ece7; color:#8a6a4a; border-color:#d9cbb9}
.ic{width:28px; height:28px; vertical-align:middle; border-radius:4px; object-fit:contain; flex:none}
.item{background:#fff; border:2px solid var(--line); border-radius:9px; padding:12px;
  display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow)}
.item.k-daily{border-left:7px solid var(--green)}
.item.k-normal{border-left:7px solid var(--blue)}
.item.k-special{border-left:7px solid var(--gold); border-color:#f0d79a; background:linear-gradient(180deg,#fffdf5,#fff)}
.item.pend{border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,169,44,.18), var(--shadow)}
.item.arch{opacity:.75}
.item .head{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.item .nm{font-size:15px; font-weight:bold; flex:1; min-width:120px; word-break:break-word}
.item .meta{font-size:12.5px; color:var(--sub); display:flex; gap:13px; flex-wrap:wrap; align-items:center}
.item .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(125px,1fr)); gap:8px}
.item .fields.col{grid-template-columns:1fr; gap:9px}
.item .fields label{display:block; font-size:11px; color:var(--sub); margin-bottom:3px}
.item .fields input,.item .fields select{width:100%}
.imgf{margin-top:2px}
.imgf label{display:block; font-size:11px; color:var(--sub); margin-bottom:3px}
.imgrow{display:flex; gap:9px; align-items:flex-start}
.imgprev{width:62px; height:62px; flex:none; border:2px dashed var(--line2); border-radius:8px;
  background:#fafbfd; display:flex; align-items:center; justify-content:center; overflow:hidden; text-align:center}
.imgprev img{width:100%; height:100%; object-fit:contain}
.imgprev .ph{font-size:10.5px; color:var(--sub); line-height:1.3; padding:2px}
.imgprev:has(img) .ph{display:none}
.imgctl{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.imgctl input{width:100%}
.imgbtns{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.dirnote{font-size:10.5px; color:var(--sub); line-height:1.6}
.imgsz{font-size:11.5px; color:var(--blue-d); font-weight:bold; white-space:nowrap}
.cur-path{font-size:11.5px; color:var(--sub); word-break:break-all}
.item .btns{display:flex; gap:7px; flex-wrap:wrap; padding-top:2px}
.upanel{background:#fff; border:2px solid var(--line); border-radius:10px; padding:14px; box-shadow:var(--shadow)}
.upanel.cur{border-color:var(--blue); box-shadow:0 0 0 3px rgba(61,130,216,.15), var(--shadow)}
.uhead{display:flex; align-items:center; gap:9px; font-size:17px; margin-bottom:11px}
.uhead .uid{font-size:11px; color:var(--sub); margin-left:auto}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:8px}
.kpi{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 4px; text-align:center}
.kpi .k{display:block; font-size:10px; color:var(--sub)}
.kpi .v{display:block; font-size:19px; font-weight:bold}
.sect{display:flex; align-items:center; gap:7px; font-size:13px; margin:14px 0 5px; color:#3a465b}
.prow{display:flex; align-items:center; gap:7px; padding:8px 0; border-top:1px solid #eef1f7}
.prow .pn{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .pg{font-size:11.5px; color:var(--sub); white-space:nowrap}
.mini{font-size:12px; color:var(--sub); padding:7px 0}
.msgprev{background:#fffbe6; border:2px solid #ffd76a; border-radius:8px; padding:8px 10px;
  font-size:12.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word;
  max-height:74px; overflow-y:auto}
.log{max-height:240px; overflow:auto; background:#fafbfd; border:2px solid var(--line);
  border-radius:7px; padding:11px; font-size:12.5px; line-height:1.95}
.log span{color:var(--sub); margin-right:8px}
textarea{width:100%; min-height:170px; font-size:12px; line-height:1.55}
textarea.msg{min-height:120px; font-size:14px; line-height:1.7}
.lvgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px}
.lvcell{border:2px solid var(--line); border-radius:8px; padding:7px; text-align:center; background:#fff}
.lvcell.now{border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,169,44,.18)}
.lvimg{height:86px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:#f3f6fb; border-radius:6px}
.lvimg img{max-width:100%; max-height:86px; object-fit:contain}
.lvimg .ph{font-size:10.5px; color:var(--sub)}
.lvimg:has(img) .ph{display:none}
.lvno{font-size:12px; margin:5px 0 3px; font-weight:bold}
.lvcell code{font-size:10px; word-break:break-all}
.szgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.szcell{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px}
.szcell label{display:block; font-size:11.5px; color:var(--sub); margin-bottom:5px}
.childrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 0; border-top:1px solid #eef1f7}
.childrow b{min-width:120px}
.straylist{font-size:11.5px; color:var(--sub); line-height:2; max-height:160px; overflow:auto;
  background:#fafbfd; border:2px solid var(--line); border-radius:7px; padding:9px; word-break:break-all}
.warncard{border-color:#f0cf8a; background:linear-gradient(180deg,#fffdf3,#fff)}
.gate{max-width:360px; margin:60px auto; text-align:center}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(18px);
  background:var(--green); color:#fff; padding:12px 22px; border-radius:8px; font-size:14px;
  opacity:0; pointer-events:none; transition:.2s; z-index:90; max-width:90vw; text-align:center;
  box-shadow:0 4px 14px rgba(38,48,63,.25)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  body{font-size:14px}
  .tabs{top:52px; padding:8px 11px}
  main{padding:11px}
  .card{padding:12px}
  .grid,.grid.wide,.grid.two{grid-template-columns:1fr}
  .row label{min-width:100%}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">かんりしゃ画面</div>
  <div class="topright">
    <span class="dot" id="connDot"><i></i><span id="connTxt">接続中…</span></span>
    <label for="userSel">こども</label>
    <select id="userSel"></select>
    <button class="btn sub sm" id="addBtn">＋こども</button>
    <span id="syncInfo"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="all">みんな</button>
  <button class="tab on" data-tab="approve">承認まち<span class="cnt zero" id="cntApprove">0</span></button>
  <button class="tab" data-tab="tiles">タイル管理</button>
  <button class="tab" data-tab="use">つかいたい<span class="cnt zero" id="cntUse">0</span></button>
  <button class="tab" data-tab="status">ステータス・メッセージ</button>
  <button class="tab" data-tab="shop">おみせ・ガチャ</button>
  <button class="tab" data-tab="look">見た目</button>
  <button class="tab" data-tab="data">データ</button>
</nav>

<main id="view"><div class="card"><h2>読み込み中…</h2></div></main>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script type="module">
/* ============================================================
   せいかつクエスト かんりしゃ画面（Firebase  Cloud Firestore 版）
   ・こどもデータは コレクション kids/{こどものID}、名簿は profiles/{ID}
   ・onSnapshot で購読しているので、承認するとこども画面に即反映されます
   ・画像は「パス参照」（image/tile/○○.png など）で保存します

   ▼ 共有タイル（shared/tiles）は廃止しました
   ・日々／通常／特別のすべてを kids/{ID}/tiles だけで管理します
   ・shared コレクションへの書き込み・読み出し・同期は一切行いません
   ・「みんなに追加」「ほかの子にもコピー」は、その時点で
     それぞれの子に独立したタイルを作るだけです（以後は連動しません）
   ・過去に作られてしまった shared の残りデータは、データタブから削除できます

   ▼ こどもが勝手に増えないための対策
   1) こども一覧は profiles だけを名簿とする（kids にあるだけの物は数えない）
   2) 保存パスに null / undefined / 空 が混ざったら書き込まない
   3) 初期データ投入は meta/seeded のトランザクションで一度きり
   4) 購読・自動リセット・こども追加は多重実行しない
   5) 迷子データ（profiles に無い kids ドキュメント）はデータタブから掃除できる
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, collection, getDoc, getDocs, onSnapshot, setDoc, writeBatch,
  runTransaction, deleteField }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* ---- 設定（firebase-config.js が無いときはここに直接書いてもOK） ---- */
const FALLBACK_CONFIG = {
  apiKey:"", authDomain:"", projectId:"", appId:""
};
const CFG  = (window.LQ_FIREBASE_CONFIG && window.LQ_FIREBASE_CONFIG.projectId)
  ? window.LQ_FIREBASE_CONFIG : FALLBACK_CONFIG;
const ROOT = window.LQ_ROOT || 'lifequest';
const PIN  = String(window.LQ_ADMIN_PIN || '');
/* Firestore で使うコレクション名（LQ_ROOT を変えると家族ごとに分離できます） */
const NS = (!ROOT || ROOT==='lifequest') ? '' : (String(ROOT).replace(/[^A-Za-z0-9_-]/g,'')+'_');
const PROFILES = NS+'profiles', KIDS = NS+'kids', META = NS+'meta';
/* ★ 廃止した共有タイル。掃除のためだけに名前を残しています（読み書き同期はしません） */
const LEGACY_SHARED = NS+'shared';
const fieldDelete = deleteField;

const IMG='image/', A=IMG+'assets/', TILE_DIR=IMG+'tile/', LV_DIR=IMG+'lv/';
const NAME_MAP  = { yuika:'ゆいか', touri:'とうり' };
const BASE_KIDS = ['yuika','touri'];

const KIND_META = {
  daily  :{label:'日々', desc:'毎日24時にリセット／この子だけの設定'},
  normal :{label:'通常', desc:'達成すると翌日に消える／この子だけの設定'},
  special:{label:'特別', desc:'キラキラ表示・達成で翌日に消える／この子だけの設定'}
};
const KIND_ORDER = ['daily','normal','special'];

const DEFAULT_ICONS = {
  coin:A+'coin.gif', star:A+'star.gif', gacha:A+'scene_gachamachine.png',
  navHome:A+'icon_nav_home.png', navStatus:A+'icon_nav_status.png', navShop:A+'icon_nav_shop.png',
  character:A+'scene_character.png', bgRoom:A+'bg_room.png'
};
const ICON_LABEL = {
  coin:'お金アイコン', star:'けいけんちアイコン', gacha:'ガチャの絵',
  navHome:'フッター：メイン（画像のみ・文字なし）',
  navStatus:'フッター：ステータス（画像のみ・文字なし）',
  navShop:'フッター：お店（画像のみ・文字なし）',
  character:'キャラ画像（レベル画像が無いとき）', bgRoom:'メイン画面の背景'
};
const DEFAULT_ICON_SIZE = {
  sm:16, lg:22, status:28, money:34, reward:14, tile:58, inv:26, shop:30, use:22, nav:26, gacha:110
};
const SIZE_LABEL = {
  sm:'小アイコン', lg:'中アイコン', status:'ステータス', money:'ヘッダーのお金', reward:'タイルの報酬',
  tile:'タイルの絵', inv:'もちもの', shop:'商品', use:'使用中リスト', nav:'フッター画像の高さ', gacha:'ガチャの絵'
};

/* ================= 小道具 ================= */
const $   = s=>document.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num = (v,d=0)=>{const n=Number(v); return isNaN(n)?d:n;};
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t=>{ if(!t) return '-'; const d=new Date(t); return isNaN(d)?'-':
  (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const safeKey = s=>String(s==null?'':s).replace(/[.#$/\[\]]/g,'_').slice(0,120) || 'k';
function defaultName(id){
  if(NAME_MAP[id]) return NAME_MAP[id];
  const m=String(id).match(/^user(\d+)$/i);
  return m ? ('プレイヤー'+m[1]) : id;
}
const IMG_EXT = /\.(png|jpe?g|jfif|gif|webp|svg|bmp|ico|avif|heic|heif)(\?.*)?$/i;
function isImg(v){
  if(typeof v!=='string') return false;
  const s=v.trim();
  if(!s) return false;
  if(s.startsWith('data:image')||s.startsWith('blob:')) return true;
  return IMG_EXT.test(s) || s.indexOf('/')>=0;
}
const brokenImg={};
function markBroken(src){ if(src) brokenImg[src]=true; }
function canShow(src){ return !!src && isImg(src) && !brokenImg[src]; }
function iconHTML(v){ return canShow(v) ? '<img class="ic" src="'+esc(v)+'" alt="">' : ''; }
document.addEventListener('error', e=>{
  const el=e.target;
  if(!el || el.tagName!=='IMG') return;
  markBroken(el.getAttribute('src')||''); el.remove();
}, true);
document.addEventListener('load', e=>{
  const el=e.target;
  if(!el || el.tagName!=='IMG') return;
  const p=el.parentElement && el.parentElement.querySelector('.ph');
  if(p) p.style.display='none';
}, true);
function toast(m,bad){
  const t=$('#toast'); t.textContent=m;
  t.style.background = bad?'var(--red)':'var(--green)';
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);
}
function fixAsset(v){
  if(typeof v!=='string') return '';
  v=v.trim().replace(/\\/g,'/');
  if(!v || v.startsWith('data:') || v.startsWith('blob:') || /^(https?:|\/\/|\/)/.test(v)) return v;
  if(!isImg(v)) return '';
  if(/^assets\//.test(v)) return IMG+v;
  if(v.indexOf('/')<0) return A+v;
  return v;
}
function fixTile(v){
  if(typeof v!=='string') return '';
  v=v.trim().replace(/\\/g,'/');
  if(!v || v.startsWith('data:') || v.startsWith('blob:') || /^(https?:|\/\/|\/)/.test(v)) return v;
  if(!isImg(v)) return '';
  if(v.indexOf('/')>=0) return v;
  return TILE_DIR+v;
}
function cleanIcon(v,tile){
  if(typeof v!=='string') return '';
  const s=v.trim();
  if(!s || !isImg(s)) return '';
  return tile ? fixTile(s) : fixAsset(s);
}
function fmtBytes(n){
  if(n<1024) return n+'B';
  if(n<1024*1024) return (n/1024).toFixed(1)+'KB';
  return (n/1024/1024).toFixed(2)+'MB';
}

/* ================= Firebase ================= */
let fdb=null, uidAuth=null, cloud={}, connected=false, adminLastId=null;

/* --- 増殖対策のための状態 --- */
const ID_RE = /^[A-Za-z0-9_-]{1,32}$/;   // 正しいこどもID
let strays = [];                          // profiles に無いのに db にだけあるデータ
let legacyShared = [];                    // 廃止した shared コレクションの残り
let seeding=false, rolling=false, addingChild=false, subscribed=false;

function P(...parts){ return parts.join('/'); }
function kidPath(kid,...rest){ return P('db',kid,...rest); }

/* 保存パスの安全チェック（null/undefined/空 が混ざった書き込みを止める） */
function pathOK(k){
  if(typeof k!=='string' || !k) return false;
  return k.split('/').every(s => s && s!=='null' && s!=='undefined');
}
/* 保存パス → Firestore のドキュメントとフィールドに変換
   'db/yuika/tiles/t1/pending' → kids/yuika の 'tiles.t1.pending'
   'profiles/yuika/name'       → profiles/yuika の 'name'
   'meta/seeded'               → meta/seeded の 'seededAt'
   ※ 'shared/...' は受け付けません（共有タイル廃止のため）           */
function refOf(path){
  const seg=String(path||'').split('/').filter(Boolean);
  if(seg[0]==='db')       return {ref:doc(fdb,KIDS,seg[1]),     field:seg.slice(2).join('.')};
  if(seg[0]==='profiles') return {ref:doc(fdb,PROFILES,seg[1]), field:seg.slice(2).join('.')};
  if(seg[0]==='meta')     return {ref:doc(fdb,META,seg[1]||'seed'), field:seg.slice(2).join('.')};
  return {ref:null, field:''};
}
async function push(o){
  if(!fdb){ toast('接続していません',true); return false; }
  const keys=Object.keys(o);
  if(!keys.length) return true;
  const bad=keys.filter(k=>o[k]!==null && !pathOK(k));
  if(bad.length){ toast('保存先が正しくありません：'+bad[0],true); return false; }
  const ops=[];
  keys.forEach(k=>{
    const r=refOf(k);
    if(!r.ref) return;
    ops.push({ref:r.ref, field:r.field, val:o[k]});
  });
  if(!ops.length) return true;
  const runBatch=async()=>{
    const batch=writeBatch(fdb);
    ops.forEach(op=>{
      if(op.val===null){
        if(op.field) batch.update(op.ref, {[op.field]: fieldDelete()});  // フィールド削除
        else         batch.delete(op.ref);                               // ドキュメント削除
      }else if(op.field){
        batch.update(op.ref, {[op.field]: op.val});   // ドット区切りで入れ子を更新
      }else{
        batch.set(op.ref, op.val);                    // ドキュメントを丸ごと置き換え
      }
    });
    await batch.commit();
  };
  try{
    await runBatch();
  }catch(e){
    /* ドキュメント自体が無いときは、空のドキュメントを作ってからやり直す */
    if(String(e.code||e.message||'').indexOf('not-found')>=0){
      try{
        const seen={};
        for(const op of ops){
          if(!op.field) continue;
          const key=op.ref.path;
          if(seen[key]) continue;
          seen[key]=1;
          await setDoc(op.ref, {}, {merge:true});
        }
        await runBatch();
      }catch(e2){ toast('保存できません：'+(e2.code||e2.message),true); return false; }
    }else{
      toast('保存できません：'+(e.code||e.message),true); return false;
    }
  }
  const si=$('#syncInfo'); if(si) si.textContent='保存 '+fmt(Date.now());
  return true;
}
function addLog(o,kid,text){
  if(!text || !kid) return;
  o[kidPath(kid,'logs','l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5))]={ts:Date.now(),text:text};
}
async function txPlayer(kid,fn){
  if(!kid || !fdb) return;
  const dref=doc(fdb, KIDS, kid);
  try{
    await runTransaction(fdb, async tx=>{
      const snap=await tx.get(dref);
      const data=snap.exists() ? (snap.data()||{}) : {};
      let p=Object.assign({name:defaultName(kid),level:1,exp:0,expToNext:100,money:0}, data.player||{});
      p.level=Math.max(1,num(p.level,1)); p.exp=Math.max(0,num(p.exp,0));
      p.expToNext=Math.max(1,num(p.expToNext,100)); p.money=Math.max(0,num(p.money,0));
      fn(p);
      tx.set(dref, {player:p}, {merge:true});
    });
  }catch(e){ toast('ほぞんできません：'+(e.code||e.message),true); }
}
const grantFn = (exp,money)=>p=>{
  p.money=Math.max(0,p.money+num(money,0)); p.exp+=num(exp,0);
  while(p.exp>=p.expToNext){ p.exp-=p.expToNext; p.level+=1; }
};
const revokeFn = (exp,money)=>p=>{
  p.money=Math.max(0,p.money-num(money,0)); p.exp-=num(exp,0);
  while(p.exp<0 && p.level>1){ p.level-=1; p.exp+=p.expToNext; }
  if(p.exp<0) p.exp=0;
};
async function txInventory(kid,fn){
  if(!kid || !fdb) return;
  const dref=doc(fdb, KIDS, kid);
  try{
    await runTransaction(fdb, async tx=>{
      const snap=await tx.get(dref);
      const inv=(snap.exists() && snap.data() && snap.data().inventory)
        ? Object.assign({}, snap.data().inventory) : {};
      fn(inv);
      tx.set(dref, {inventory:inv}, {merge:true});
    });
  }catch(e){ toast('ほぞんできません：'+(e.code||e.message),true); }
}
function invAdd(inv,refId,icon,name,qty){
  const hit=Object.keys(inv).find(k=>inv[k] && inv[k].refId===refId);
  if(hit) inv[hit].qty=num(inv[hit].qty,1)+num(qty,1);
  else inv['inv_'+safeKey(refId)+'_'+Date.now()]={refId:refId,icon:icon||'',name:name||'アイテム',qty:num(qty,1)};
}

/* ================= 読み出し（クラウド → 画面用の形） ================= */
function listOf(o,descKey){
  if(!o || typeof o!=='object') return [];
  const a=Object.keys(o).filter(k=>o[k]&&typeof o[k]==='object')
    .map(k=>Object.assign({},o[k],{id:k}));
  if(descKey) a.sort((x,y)=>num(y[descKey],0)-num(x[descKey],0));
  else a.sort((x,y)=>{ const d=num(x.ord,0)-num(y.ord,0); return d||String(x.id).localeCompare(String(y.id)); });
  return a;
}
function nextOrd(arr){ return arr.reduce((m,x)=>Math.max(m,num(x.ord,0)),0)+10; }
function kidLocal(kid){
  const s=(cloud.db && cloud.db[kid]) || {};
  const p=Object.assign({name:defaultName(kid),level:1,exp:0,expToNext:100,money:0}, s.player||{});
  const d={
    id:kid,
    player:{ name:p.name||defaultName(kid), level:Math.max(1,num(p.level,1)),
      exp:Math.max(0,num(p.exp,0)), expToNext:Math.max(1,num(p.expToNext,100)),
      money:Math.max(0,num(p.money,0)) },
    message: typeof s.message==='string' ? s.message : '',
    messageAt: num(s.messageAt,0),
    lastResetDate: s.lastResetDate || '',
    icons:{}, iconSize:{},
    /* ★ タイルは kids/{ID}/tiles だけ。共有タイルは合成しません */
    tiles:listOf(s.tiles),
    shopItems:listOf(s.shopItems),
    gacha:{ cost:num(s.gacha&&s.gacha.cost,300), pool:listOf(s.gacha&&s.gacha.pool) },
    inventory:listOf(s.inventory),
    useRequests:listOf(s.useRequests,'at'),
    useHistory:listOf(s.useHistory,'usedAt'),
    logs:listOf(s.logs,'ts')
  };
  Object.keys(DEFAULT_ICONS).forEach(k=>{
    const v=(s.icons&&typeof s.icons[k]==='string')?s.icons[k]:DEFAULT_ICONS[k];
    d.icons[k]=fixAsset(v);
  });
  Object.keys(DEFAULT_ICON_SIZE).forEach(k=>{
    d.iconSize[k]=Math.max(6,num(s.iconSize&&s.iconSize[k],DEFAULT_ICON_SIZE[k]));
  });
  d.tiles.forEach(t=>{
    if(!KIND_META[t.kind]) t.kind='daily';
    t.label=String(t.label||'タイル');
    t.icon=cleanIcon(t.icon,false); t.cardImage=cleanIcon(t.cardImage,true);
    t.rewardExp=num(t.rewardExp,0); t.rewardMoney=num(t.rewardMoney,0);
    t.completed=!!t.completed; t.pending=!!t.pending; t.archived=!!t.archived;
  });
  d.shopItems.forEach(x=>{ x.name=String(x.name||'商品'); x.price=num(x.price,0);
    x.desc=String(x.desc||''); x.icon=cleanIcon(x.icon,false); });
  d.gacha.pool.forEach(g=>{ g.name=String(g.name||'景品'); g.rarity=String(g.rarity||'N');
    g.weight=Math.max(0,num(g.weight,1)); g.icon=cleanIcon(g.icon,false); });
  d.inventory.forEach(i=>{ i.qty=num(i.qty,1); i.icon=cleanIcon(i.icon,false); i.name=String(i.name||'アイテム'); });
  d.useRequests.forEach(r=>{ r.icon=cleanIcon(r.icon,false); r.name=String(r.name||'アイテム'); });
  d.useHistory.forEach(h=>{ h.icon=cleanIcon(h.icon,false); });
  return d;
}

/* ★ こども一覧は /profiles だけを名簿にする（ここが増殖の主因でした） */
function loadProfiles(){
  const pr  = (cloud.profiles && typeof cloud.profiles==='object') ? cloud.profiles : {};
  const kids= (cloud.db       && typeof cloud.db==='object')       ? cloud.db       : {};
  profiles = Object.keys(pr)
    .filter(id => ID_RE.test(id) && pr[id] && typeof pr[id]==='object')
    .map(id=>{
      const nm=(kids[id]&&kids[id].player&&kids[id].player.name) || pr[id].name || defaultName(id);
      return {id:id, name:nm, ord:num(pr[id].ord, BASE_KIDS.indexOf(id)>=0?BASE_KIDS.indexOf(id):99)};
    })
    .sort((a,b)=>a.ord-b.ord || a.id.localeCompare(b.id));
  strays = Object.keys(kids).filter(id => !(pr[id] && typeof pr[id]==='object'));
  if(currentId && !profiles.some(p=>p.id===currentId)) currentId=null;
}

/* ★ 初期データ投入は meta/seeded で一度きり */
async function seedBaseKidsOnce(){
  if(seeded || seeding || !fdb) return;
  seeding=true;
  try{
    const seedRef=doc(fdb, META, 'seeded');
    try{
      await runTransaction(fdb, async tx=>{
        const snap=await tx.get(seedRef);
        if(snap.exists()) return;
        tx.set(seedRef, {seededAt:Date.now()});
      });
    }catch(e){ /* 同時実行で取られた場合も一度きり扱いで OK */ }
    seeded = true;
    const snap = await getDocs(collection(fdb, PROFILES));
    if(!snap.empty) return;                          // 誰かいるなら作らない
    const batch=writeBatch(fdb);
    BASE_KIDS.forEach((kid,i)=>{
      batch.set(doc(fdb, KIDS, kid), seedKid(kid));
      batch.set(doc(fdb, PROFILES, kid), {name:defaultName(kid),ord:(i+1)*10});
    });
    await batch.commit();
    toast('ゆいか（yuika）と とうり（touri）を用意しました');
  }catch(e){
    seeded=true;
  }finally{ seeding=false; }
}

/* ================= 廃止した共有タイルの掃除 ================= */
async function checkLegacyShared(){
  if(!fdb) return;
  try{
    const snap=await getDocs(collection(fdb, LEGACY_SHARED));
    const ids=[]; snap.forEach(d=>ids.push(d.id));
    legacyShared=ids;
  }catch(e){ legacyShared=[]; }
  scheduleRender();
}
async function deleteLegacyShared(){
  if(!fdb){ toast('接続していません',true); return; }
  try{
    const snap=await getDocs(collection(fdb, LEGACY_SHARED));
    if(snap.empty){ legacyShared=[]; toast('残りデータはありませんでした'); scheduleRender(); return; }
    const batch=writeBatch(fdb);
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    const n=snap.size;
    legacyShared=[];
    toast('共有タイルの残りデータ '+n+' 件を削除しました');
    scheduleRender();
  }catch(e){ toast('削除できません：'+(e.code||e.message),true); }
}

/* ================= 画面切りかえ ================= */
function typing(){
  const a=document.activeElement;
  return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
}
function scheduleRender(){
  if(busy || typing()){ dirty=true; return; }
  dirty=false; render();
}
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(dirty && !typing() && !busy){ dirty=false; render(); } },250));

function counts(){
  const ea=$('#cntApprove'), eu=$('#cntUse');
  const a = db ? db.tiles.filter(t=>t.pending&&!t.completed&&!t.archived).length : 0;
  const u = db ? db.useRequests.length : 0;
  ea.textContent=a; ea.classList.toggle('zero',a===0);
  eu.textContent=u; eu.classList.toggle('zero',u===0);
}
function fillSelect(){
  const sel=$('#userSel');

  sel.innerHTML = profiles.length
    ? profiles.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===cur?' selected':'')+'>'+esc(p.name||p.id)+'（'+esc(p.id)+'）</option>').join('')
    : '<option value="">（いません）</option>';

  if(!CFG.projectId){ $('#view').innerHTML=viewSetup(); return; }

  counts(); fillSelect();
  if(!currentId || !db){
    $('#view').innerHTML='<div class="card"><h2>こどもが登録されていません</h2>'
      +'<div class="row"><button class="btn ok" data-act="addChild">こどもを追加する</button></div>'
      +'<div class="hint">IDを <code>yuika</code> にすると <code>yuika_app.html</code> と結びつきます。</div>'
      +(strays.length ? '<div class="row" style="margin-top:11px">'
        +'<button class="btn ng" data-act="cleanStray">登録されていないデータ '+strays.length+' 件を削除</button>'
        +'<button class="btn sub" data-act="adoptStray">こども一覧に登録しなおす</button></div>'
        +'<div class="straylist">'+strays.slice(0,80).map(k=>'<code>'+esc(k)+'</code>').join('、')
        +(strays.length>80?' ほか':'')+'</div>' : '')
      +'</div>';

/* ================= 画像の選択（パス参照で保存） ================= */
const newImg = {tileCard:'', shopIcon:'', prizeIcon:''};
const imgMetaCache={}, previewURL={};
function dirOf(scope,field){
  if(scope==='tiles' && field==='cardImage') return TILE_DIR;
  if(scope==='new'   && field==='tileCard')  return TILE_DIR;
  return A;
}
function buildPath(scope,field,fileName){
  const base=String(fileName||'').replace(/\\/g,'/').split('/').pop().trim();
  return base ? dirOf(scope,field)+base : '';
}
function looksLikeImage(file){
  if(!file) return false;
  if(file.type && file.type.startsWith('image/')) return true;
  return IMG_EXT.test(file.name||'');
}
function readAsDataURL(file){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(String(fr.result||'')); fr.onerror=()=>rej(new Error('読み込めません'));
    fr.readAsDataURL(file); });
}
function readImgMeta(src){
  return new Promise((res,rej)=>{ if(!src) return rej(new Error('なし'));
    const im=new Image(); im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight});
    im.onerror=()=>rej(new Error('サイズ不明')); im.src=src; });
}
function probeImageExists(src){
  return new Promise(resolve=>{ if(!src){ resolve(false); return; }
    const im=new Image(); im.onload=()=>resolve(true); im.onerror=()=>resolve(false); im.src=src; });
}

  pickInput.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(pickInput);
  pickInput.addEventListener('change', onPicked);

}
function openPicker(scope,id,field){
  if(!scope||!field){ toast('もう一度「画像を選ぶ」を押してください',true); return; }
  pickTarget={scope:scope,id:id||'',field:field};
  const inp=ensurePicker(); inp.value=''; inp.click();
}
async function onPicked(){
  const t=pickTarget, file=pickInput.files && pickInput.files[0];
  pickInput.value='';
  if(!t){ toast('もう一度「画像を選ぶ」を押してください',true); return; }
  if(!file) return;
  if(!looksLikeImage(file)){ toast('画像ファイルを選んでください',true); return; }
  const metaKey=t.scope+'_'+t.id+'_'+t.field;
  try{
    const durl=await readAsDataURL(file);
    previewURL[metaKey]=durl;
    try{ const m=await readImgMeta(durl); imgMetaCache[metaKey]=m.w+'×'+m.h+'px（'+fmtBytes(file.size)+'）'; }
    catch(e){ imgMetaCache[metaKey]=fmtBytes(file.size); }
  }catch(e){ imgMetaCache[metaKey]=fmtBytes(file.size); }
  const path=buildPath(t.scope,t.field,file.name);
  if(!path){ toast('ファイル名を読み取れませんでした',true); return; }
  applyImage(t.scope,t.id,t.field,path,true);
}
function imgField(o){
  const attr=o.attr||'data-f';
  const val=(typeof o.val==='string')?o.val:'';
  const dir=dirOf(o.scope,o.field);
  const sc=esc(o.scope), si=esc(o.id), sf=esc(o.field);
  const metaKey=o.scope+'_'+o.id+'_'+o.field;
  const metaTxt=imgMetaCache[metaKey]||'';
  const pv=previewURL[metaKey]||(canShow(val)?val:'');
  const dsa=' data-scope="'+sc+'" data-id="'+si+'" data-field="'+sf+'"';
  return '<div class="imgf"><label>'+esc(o.label)+'</label><div class="imgrow">'
    +'<div class="imgprev" id="prev_'+sc+'_'+si+'_'+sf+'">'
    +'<span class="ph">'+(val?'画像なし':'未設定')+'</span>'
    +(pv?'<img src="'+esc(pv)+'" alt="">':'')+'</div>'
    +'<div class="imgctl">'
    +'<input '+attr+'="'+sf+'" data-path="'+sc+'|'+si+'|'+sf+'" value="'+esc(val)+'" placeholder="'+esc(o.ph||'')+'">'
    +'<div class="imgbtns">'
    +'<button class="btn sub sm" data-act="pick"'+dsa+'>画像を選ぶ</button>'
    +'<button class="btn sub sm" data-act="applypath"'+dsa+'>パスを反映</button>'
    +'<span class="imgsz">'+esc(metaTxt)+'</span>'
    +(val ? '<button class="btn sub sm" data-act="clearimg"'+dsa+'>設定を消す</button>':'')
    +'</div>'
    +'<div class="cur-path">'+(val?('参照パス：<code>'+esc(val)+'</code>'):'未設定（文字だけ表示されます）')+'</div>'
    +'<div class="dirnote">ファイル名だけなら <code>'+esc(dir)+'</code> のファイルとして参照します。'
    +'フォルダを含めて書くと、そのパスをそのまま参照します。</div>'
    +'</div></div></div>';
}
function fieldPath(scope,id,field){
  if(!currentId) return '';
  if(scope==='tiles')     return kidPath(currentId,'tiles',id,field);
  if(scope==='shopItems') return kidPath(currentId,'shopItems',id,field);
  if(scope==='gachaPool') return kidPath(currentId,'gacha','pool',id,field);
  if(scope==='icons')     return kidPath(currentId,'icons',field);
  return '';
}
async function applyImage(scope,id,field,val,fromPick){
  const dir=dirOf(scope,field);
  val=(typeof val==='string')?val.trim():'';
  if(val) val=(dir===TILE_DIR)?fixTile(val):fixAsset(val);
  if(val) delete brokenImg[val];

  if(scope==='new'){
    if(!Object.prototype.hasOwnProperty.call(newImg,field)){ toast('設定先が見つかりません',true); return; }
    newImg[field]=val;
    const metaKey='new_'+id+'_'+field;
    const box=document.getElementById('prev_new_'+id+'_'+field);
    if(box){ const pv=previewURL[metaKey]||(canShow(val)?val:'');
      box.innerHTML='<span class="ph">'+(val?'画像なし':'未設定')+'</span>'+(pv?'<img src="'+esc(pv)+'" alt="">':''); }
    const inp=document.querySelector('[data-path="new|'+id+'|'+field+'"]');
    if(inp) inp.value=val||'';
    if(val && fromPick) noticePath(val); else toast(val?'画像を選びました（追加ボタンで登録されます）':'画像の設定を消しました');
    return;
  }
  const p=fieldPath(scope,id,field);
  if(!p || !pathOK(p)){ toast('設定先が見つかりません',true); return; }
  const o={}; o[p]=val;
  addLog(o,currentId, val?('画像を設定：'+val):'画像の設定を消去');
  if(!await push(o)) return;
  if(val && fromPick) noticePath(val);
  else toast(val?'画像を設定しました':'画像の設定を消しました（文字だけ表示になります）');
}
function noticePath(path){
  probeImageExists(path).then(ok=>{
    if(ok) toast('画像を設定しました：'+path);
    else toast(path+' として設定しました。GitHub のこのパスに画像を置くと表示されます');
  });
}
async function checkMissingTileImages(){
  const list=db.tiles.filter(t=>t.cardImage);
  if(!list.length){ toast('確認する画像がありません'); return; }
  toast('画像を確認しています…'); busy=true;
  const broken=[];
  try{
    for(const t of list){
      const ok=await probeImageExists(t.cardImage);
      if(!ok){ markBroken(t.cardImage); broken.push(t); }
    }
  } finally { busy=false; }
  if(!broken.length){ toast('すべての画像が見つかりました'); return; }
  const o={};
  broken.forEach(t=>{ o[kidPath(currentId,'tiles',t.id,'cardImage')]=''; });
  addLog(o,currentId,'画像が見つからないタイル'+broken.length+'件の設定を解除');
  if(await push(o)) toast(broken.length+'件のタイルを文字だけの表示に戻しました');
}

/* ================= 入力の収集 ================= */
function scopePath(scope,id){
  if(!currentId || !id) return '';
  if(scope==='tiles')     return kidPath(currentId,'tiles',id);
  if(scope==='shopItems') return kidPath(currentId,'shopItems',id);
  if(scope==='gachaPool') return kidPath(currentId,'gacha','pool',id);
  return '';
}
function collectBox(box,o){
  const scope=box.dataset.scope, id=box.dataset.id;
  const base=scopePath(scope,id);
  if(!base) return false;
  let any=false;
  box.querySelectorAll('[data-f]').forEach(inp=>{
    const f=inp.dataset.f;
    let v=inp.value;
    if(['rewardExp','rewardMoney','price','weight','ord'].indexOf(f)>=0) v=num(v,0);
    if(f==='cardImage') v=fixTile(v);
    if(f==='icon')      v=fixAsset(v);
    o[base+'/'+f]=v; any=true;
  });
  return any;
}
async function saveEdits(){
  if(!currentId){ toast('こどもが選ばれていません',true); return; }
  const o={};
  document.querySelectorAll('.item[data-scope][data-id]').forEach(b=>collectBox(b,o));
  document.querySelectorAll('[data-f]').forEach(inp=>{
    if(inp.closest('.item[data-scope][data-id]')) return;
    const f=inp.dataset.f;
    if(Object.prototype.hasOwnProperty.call(DEFAULT_ICONS,f)) o[kidPath(currentId,'icons',f)]=fixAsset(inp.value);
  });
  /* 見た目タブでは .item の中にアイコン入力があるので拾い直す */
  document.querySelectorAll('.item [data-f]').forEach(inp=>{
    const box=inp.closest('.item[data-scope][data-id]');
    if(box) return;
    const f=inp.dataset.f;
    if(Object.prototype.hasOwnProperty.call(DEFAULT_ICONS,f)) o[kidPath(currentId,'icons',f)]=fixAsset(inp.value);
  });
  if(!Object.keys(o).length){ toast('保存する内容がありません'); return; }
  addLog(o,currentId,'編集を保存');
  if(await push(o)) toast('保存しました');
}
function newImgValue(field){
  const inp=document.querySelector('[data-skip="'+field+'"]');
  const typed=inp ? (inp.value||'').trim() : '';
  return typed || newImg[field] || '';
}
function download(name,href){
  const a=document.createElement('a'); a.href=href; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ================= こどもの追加（多重実行しない） ================= */
async function addChild(){
  if(addingChild) return;
  if(!fdb){ toast('接続していません',true); return; }
  addingChild=true;
  try{
    const kid=(prompt('こどものID（半角英数字）\nこども用ファイル名の「_app.html」より前と同じにしてください',
      'kid'+(profiles.length+1))||'').trim();
    if(!kid) return;
    if(!ID_RE.test(kid)){ toast('半角英数字・ハイフン・アンダーバーで32文字までにしてください',true); return; }
    const [pf,dbn]=await Promise.all([
      getDoc(doc(fdb, PROFILES, kid)),
      getDoc(doc(fdb, KIDS, kid))
    ]);
    if(pf.exists()||dbn.exists()){ toast('すでに登録されています',true); return; }
    const batch=writeBatch(fdb);
    batch.set(doc(fdb, KIDS, kid), seedKid(kid));
    batch.set(doc(fdb, PROFILES, kid), {name:defaultName(kid),ord:(profiles.length+1)*10});
    await batch.commit();
    currentId=kid; toast(kid+' を追加しました（'+kid+'_app.html でひらけます）');
  }catch(e){
    toast('追加できませんでした：'+(e.code||e.message),true);
  }finally{ addingChild=false; }
}

/* ================= クリック処理 ================= */
document.addEventListener('click', async e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const act=btn.dataset.act;
  const box=btn.closest('.item[data-scope][data-id]');
  const id=box?box.dataset.id:null;
  const scope=box?box.dataset.scope:null;

  /* --- 画像 --- */
  if(act==='pick'){ e.preventDefault(); openPicker(btn.dataset.scope,btn.dataset.id,btn.dataset.field); return; }
  if(act==='applypath'){ e.preventDefault();
    const inp=document.querySelector('[data-path="'+btn.dataset.scope+'|'+btn.dataset.id+'|'+btn.dataset.field+'"]');
    applyImage(btn.dataset.scope,btn.dataset.id,btn.dataset.field,inp?inp.value:''); return; }
  if(act==='clearimg'){
    const key=btn.dataset.scope+'_'+btn.dataset.id+'_'+btn.dataset.field;
    delete imgMetaCache[key]; delete previewURL[key];
    applyImage(btn.dataset.scope,btn.dataset.id,btn.dataset.field,''); return; }
  if(act==='checkTileImgs'){ if(db) checkMissingTileImages(); return; }

  /* --- 共有タイル（廃止）の掃除 --- */
  if(act==='delLegacyShared'){
    if(!confirm('廃止した共有タイル（'+LEGACY_SHARED+'）の残りデータを削除します。よろしいですか？\n'
      +'各こどものタイルには影響しません。')) return;
    deleteLegacyShared(); return;
  }
  if(act==='recheckShared'){ checkLegacyShared(); toast('しらべました'); return; }

  /* --- こども --- */
  if(act==='addChild'){ addChild(); return; }
  if(act==='delChild'){
    const kid=btn.dataset.uid;
    if(!kid) return;
    if(!confirm(kid+' のデータを完全に消します。よろしいですか？')) return;
    const o={}; o[kidPath(kid)]=null; o[P('profiles',kid)]=null;
    if(await push(o)){ if(currentId===kid){ currentId = (profiles.find(p=>p.id!==kid)||{}).id||null; } toast(kid+' を削除しました'); }
    return;
  }
  if(act==='bulkDelChild'){
    if(!profiles.length){ toast('こどもがいません',true); return; }
    const keep=(prompt('残すこどものIDをカンマ区切りで入れてください\n（ここに書かなかった子は完全に削除されます）',
      profiles.slice(0,2).map(p=>p.id).join(','))||'').trim();
    if(!keep) return;
    const keepSet={}; keep.split(/[,、\s]+/).filter(Boolean).forEach(k=>keepSet[k]=1);
    const del=profiles.filter(p=>!keepSet[p.id]).map(p=>p.id);
    if(!del.length){ toast('削除対象がありません'); return; }
    if(!confirm(del.length+'人ぶんのデータを完全に削除します。よろしいですか？\n'
      +del.slice(0,20).join('、')+(del.length>20?' ほか':''))) return;
    const o={}; del.forEach(k=>{ o[kidPath(k)]=null; o[P('profiles',k)]=null; });
    if(await push(o)){
      if(!keepSet[currentId]) currentId=Object.keys(keepSet)[0]||null;
      toast(del.length+'人を削除しました');
    }
    return;
  }
  if(act==='cleanStray'){
    if(!strays.length){ toast('ありません'); return; }
    if(!confirm('こども一覧に無いデータ '+strays.length+' 件を削除します。よろしいですか？')) return;
    const o={}; strays.forEach(k=>{ o[P('db',k)]=null; });
    if(await push(o)) toast(strays.length+'件を削除しました');
    return;
  }
  if(act==='adoptStray'){
    const ok=strays.filter(k=>ID_RE.test(k));
    if(!ok.length){ toast('登録できるIDがありません',true); return; }
    if(!confirm(ok.length+'件をこども一覧に登録します。よろしいですか？')) return;
    const o={}; let n=profiles.length;
    ok.forEach(k=>{
      const s=(cloud.db&&cloud.db[k])||{};
      o[P('profiles',k)]={name:(s.player&&s.player.name)||defaultName(k), ord:(++n)*10};
    });
    if(await push(o)) toast(ok.length+'件を登録しました');
    return;
  }
  if(act==='switchTo'){
    const kid=btn.dataset.uid;
    if(!kid || !profiles.some(p=>p.id===kid)) return;
    currentId=kid; tab='approve';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='approve'));
    render(); toast(currentId+' を編集します'); return;
  }

  /* --- みんなタブ（ほかの子への操作）：db が無くても動くのでここで処理 --- */
  if(act==='oapprove'||act==='oreject'){
    const kid=btn.dataset.uid, tid=btn.dataset.tid;
    if(!kid||!tid) return;
    const d=kidLocal(kid), t=d.tiles.find(x=>x.id===tid); if(!t) return;
    const o={};
    if(act==='oapprove'){
      o[kidPath(kid,'tiles',tid,'completed')]=true;
      o[kidPath(kid,'tiles',tid,'pending')]=false;
      addLog(o,kid,'「'+t.label+'」を承認');
      if(!t.completed) await txPlayer(kid, grantFn(t.rewardExp,t.rewardMoney));
    }else{
      o[kidPath(kid,'tiles',tid,'pending')]=false;
      addLog(o,kid,'「'+t.label+'」の申請を取消');
    }
    if(await push(o)) toast('更新しました');
    return;
  }
  if(act==='oconsume'||act==='oback'){
    const kid=btn.dataset.uid, rid=btn.dataset.rid;
    if(!kid||!rid) return;
    const d=kidLocal(kid), r=d.useRequests.find(x=>x.id===rid); if(!r) return;
    const o={}; o[kidPath(kid,'useRequests',rid)]=null;
    if(act==='oconsume'){
      o[kidPath(kid,'useHistory','h'+Date.now().toString(36))]={icon:r.icon||'',name:r.name,usedAt:Date.now()};
      addLog(o,kid,'「'+r.name+'」を消費');
    }else{
      await txInventory(kid, inv=>invAdd(inv,r.refId,r.icon,r.name,1));
      addLog(o,kid,'「'+r.name+'」をもちものに差し戻し');
    }
    if(await push(o)) toast('更新しました');
    return;
  }

  /* --- ここから先は「いま編集中のこども」が必要 --- */
  if(!db || !currentId) return;

  if(act==='saveOne' && box){
    const o={};
    if(!collectBox(box,o)){ toast('保存対象が見つかりません',true); return; }
    addLog(o,currentId,'1件を保存');
    if(await push(o)) toast('この1件を保存しました');
    return;
  }

  /* --- タイル（すべて この子のデータだけを更新します） --- */
  if(act==='approve' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const o={};
    o[kidPath(currentId,'tiles',id,'completed')]=true;
    o[kidPath(currentId,'tiles',id,'pending')]=false;
    addLog(o,currentId,'「'+t.label+'」を承認（+'+t.rewardExp+'EXP / +'+t.rewardMoney+'）');
    if(!t.completed) await txPlayer(currentId, grantFn(t.rewardExp,t.rewardMoney));
    if(await push(o)) toast('承認しました');
    return;
  }
  if(act==='reject' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const o={}; o[kidPath(currentId,'tiles',id,'pending')]=false;
    addLog(o,currentId,'「'+t.label+'」の申請を取消');
    if(await push(o)) toast('取り消しました');
    return;
  }
  if(act==='undo' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const o={};
    o[kidPath(currentId,'tiles',id,'completed')]=false;
    o[kidPath(currentId,'tiles',id,'pending')]=false;
    addLog(o,currentId,'「'+t.label+'」を未達成に戻す');
    if(t.completed) await txPlayer(currentId, revokeFn(t.rewardExp,t.rewardMoney));
    if(await push(o)) toast('戻しました');
    return;
  }
  if(act==='hideTile' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const o={};
    o[kidPath(currentId,'tiles',id,'archived')]=true;
    o[kidPath(currentId,'tiles',id,'pending')]=false;
    addLog(o,currentId,'「'+t.label+'」をかくす');
    if(await push(o)) toast('かくしました');
    return;
  }
  if(act==='restore' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const o={};
    o[kidPath(currentId,'tiles',id,'archived')]=false;
    o[kidPath(currentId,'tiles',id,'completed')]=false;
    o[kidPath(currentId,'tiles',id,'pending')]=false;
    addLog(o,currentId,'「'+t.label+'」を表示にもどす');
    if(await push(o)) toast('もどしました');
    return;
  }
  if(act==='delTile' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    if(!confirm('「'+t.label+'」を削除しますか？\n（'+db.player.name+' のタイルだけを消します）')) return;
    const o={}; o[kidPath(currentId,'tiles',id)]=null;
    addLog(o,currentId,'タイル削除：'+t.label);
    if(await push(o)) toast('削除しました');
    return;
  }
  if(act==='copyTile' && id){
    const t=db.tiles.find(x=>x.id===id); if(!t) return;
    const others=profiles.filter(p=>p.id!==currentId);
    if(!others.length){ toast('ほかの子がいません',true); return; }
    if(!confirm('「'+t.label+'」を ほかの'+others.length+'人にも複製しますか？\n'
      +'（それぞれ別のタイルになります。あとから連動はしません）')) return;
    const o={};
    others.forEach(p=>{
      const kd=kidLocal(p.id), key='tl_'+uid();
      o[kidPath(p.id,'tiles',key)]={kind:t.kind,label:t.label,icon:t.icon||'',cardImage:t.cardImage||'',
        rewardExp:t.rewardExp,rewardMoney:t.rewardMoney,completed:false,pending:false,archived:false,ord:nextOrd(kd.tiles)};
      addLog(o,p.id,'タイル追加：'+t.label);
    });
    if(await push(o)) toast(others.length+'人に複製しました');
    return;
  }
  if(act==='addTile'){
    const label=($('#a_label').value||'').trim();
    if(!label){ toast('なまえを入れてください',true); return; }
    const kind=$('#a_kind').value;
    const exp=num($('#a_exp').value,0), money=num($('#a_money').value,0);
    const card=fixTile(newImgValue('tileCard'));
    const all=$('#a_all') && $('#a_all').checked;
    const ordInp=$('#a_ord');
    const ordVal = (ordInp && String(ordInp.value).trim()!=='') ? num(ordInp.value,0) : null;
    const targets = all ? profiles.map(p=>p.id) : [currentId];
    const o={};
    targets.forEach(kid=>{
      const kd=kidLocal(kid), key='tl_'+uid();
      o[kidPath(kid,'tiles',key)]={kind:kind,label:label,icon:'',cardImage:card,
        rewardExp:exp,rewardMoney:money,completed:false,pending:false,archived:false,
        ord:(ordVal===null ? nextOrd(kd.tiles) : ordVal)};
      addLog(o,kid,'タイル追加：'+label);
    });
    newImg.tileCard=''; delete previewURL['new_new_tileCard']; delete imgMetaCache['new_new_tileCard'];
    if(await push(o)) toast(all?('みんなに追加しました（それぞれ別のタイルです）'):'追加しました');
    return;
  }
  if(act==='saveEdits'){ saveEdits(); return; }

  /* --- つかいたい --- */
  if(act==='consume' && id){
    const r=db.useRequests.find(x=>x.id===id); if(!r) return;
    const o={};
    o[kidPath(currentId,'useRequests',id)]=null;
    o[kidPath(currentId,'useHistory','h'+Date.now().toString(36))]={icon:r.icon||'',name:r.name,usedAt:Date.now()};
    addLog(o,currentId,'「'+r.name+'」を消費');
    if(await push(o)) toast('消費しました');
    return;
  }
  if(act==='back' && id){
    const r=db.useRequests.find(x=>x.id===id); if(!r) return;
    await txInventory(currentId, inv=>invAdd(inv,r.refId,r.icon,r.name,1));
    const o={}; o[kidPath(currentId,'useRequests',id)]=null;
    addLog(o,currentId,'「'+r.name+'」をもちものに差し戻し');
    if(await push(o)) toast('差し戻しました');
    return;
  }
  if((act==='plus'||act==='minus'||act==='delInv') && id && scope==='inventory'){
    const i=db.inventory.find(x=>x.id===id); if(!i) return;
    if(act==='delInv'){
      const o={}; o[kidPath(currentId,'inventory',id)]=null;
      addLog(o,currentId,'もちもの削除：'+i.name);
      if(await push(o)) toast('削除しました');
      return;
    }
    const delta = act==='plus'?1:-1;
    await runTransaction(fdb, async tx=>{
      const iref=doc(fdb, KIDS, currentId);
      const snap=await tx.get(iref);
      const inv=(snap.exists() && snap.data() && snap.data().inventory)
        ? Object.assign({}, snap.data().inventory) : {};
      const it=inv[id];
      if(!it) return;
      const q=num(it.qty,1)+delta;
      if(q<=0) delete inv[id]; else it.qty=q;
      tx.set(iref, {inventory:inv}, {merge:true});
    });
    const o={}; addLog(o,currentId,'もちもの変更：'+i.name+'（'+(delta>0?'+1':'-1')+'）');
    push(o);
    return;
  }

  /* --- おみせ --- */
  if(act==='giveShop' && id){
    const s=db.shopItems.find(x=>x.id===id); if(!s) return;
    await txInventory(currentId, inv=>invAdd(inv,s.id,s.icon,s.name,1));
    const o={};
    o[kidPath(currentId,'notify','n'+Date.now().toString(36))]={at:Date.now(),text:'🎁「'+s.name+'」がとどいた！'};
    addLog(o,currentId,'プレゼント：'+s.name);
    if(await push(o)) toast('プレゼントしました');
    return;
  }
  if(act==='delShop' && id){
    const s=db.shopItems.find(x=>x.id===id); if(!s) return;
    if(!confirm('「'+s.name+'」を削除しますか？')) return;
    const o={}; o[kidPath(currentId,'shopItems',id)]=null;
    addLog(o,currentId,'商品削除：'+s.name);
    if(await push(o)) toast('削除しました');
    return;
  }
  if(act==='addShop'){
    const name=($('#s_name').value||'').trim();
    if(!name){ toast('商品名を入れてください',true); return; }
    const o={};
    o[kidPath(currentId,'shopItems','sh_'+uid())]={name:name,price:num($('#s_price').value,0),
      desc:'',icon:fixAsset(newImgValue('shopIcon')),ord:nextOrd(db.shopItems)};
    addLog(o,currentId,'商品追加：'+name);
    newImg.shopIcon=''; delete previewURL['new_new_shopIcon']; delete imgMetaCache['new_new_shopIcon'];
    if(await push(o)) toast('追加しました');
    return;
  }
  if(act==='saveCost'){
    const o={}; o[kidPath(currentId,'gacha','cost')]=num($('#g_cost').value,300);
    addLog(o,currentId,'ガチャの値段を変更');
    if(await push(o)) toast('保存しました');
    return;
  }
  if(act==='givePrize' && id){
    const g=db.gacha.pool.find(x=>x.id===id); if(!g) return;
    await txInventory(currentId, inv=>invAdd(inv,'gacha_'+g.id,g.icon,g.name,1));
    const o={};
    o[kidPath(currentId,'notify','n'+Date.now().toString(36))]={at:Date.now(),text:'🎁「'+g.name+'」がとどいた！'};
    addLog(o,currentId,'プレゼント：'+g.name);
    if(await push(o)) toast('プレゼントしました');
    return;
  }
  if(act==='delPrize' && id){
    const g=db.gacha.pool.find(x=>x.id===id); if(!g) return;
    if(!confirm('「'+g.name+'」を削除しますか？')) return;
    const o={}; o[kidPath(currentId,'gacha','pool',id)]=null;
    addLog(o,currentId,'景品削除：'+g.name);
    if(await push(o)) toast('削除しました');
    return;
  }
  if(act==='addPrize'){
    const name=($('#g_name').value||'').trim();
    if(!name){ toast('景品名を入れてください',true); return; }
    const o={};
    o[kidPath(currentId,'gacha','pool','g_'+uid())]={name:name,rarity:($('#g_rarity').value||'N').trim(),
      weight:Math.max(0,num($('#g_weight').value,10)),icon:fixAsset(newImgValue('prizeIcon')),ord:nextOrd(db.gacha.pool)};
    addLog(o,currentId,'景品追加：'+name);
    newImg.prizeIcon=''; delete previewURL['new_new_prizeIcon']; delete imgMetaCache['new_new_prizeIcon'];
    if(await push(o)) toast('追加しました');
    return;
  }

  /* --- メッセージ --- */
  if(act==='saveMsg'){
    const o={};
    o[kidPath(currentId,'message')]=($('#p_msg').value||'').slice(0,500);
    o[kidPath(currentId,'messageAt')]=Date.now();
    addLog(o,currentId,'メッセージを更新');
    if(await push(o)) toast('メッセージを保存しました');
    return;
  }
  if(act==='clearMsg'){
    const o={};
    o[kidPath(currentId,'message')]=''; o[kidPath(currentId,'messageAt')]=Date.now();
    addLog(o,currentId,'メッセージを消去');
    if(await push(o)) toast('メッセージを消しました');
    return;
  }

  /* --- ステータス --- */
  if(act==='m'){ const el=$('#p_money'); el.value=Math.max(0,num(el.value,0)+num(btn.dataset.v,0)); return; }
  if(act==='x'){ const el=$('#p_exp');   el.value=Math.max(0,num(el.value,0)+num(btn.dataset.v,0)); return; }
  if(act==='saveP'){
    const nm=($('#p_name').value||'').trim() || db.player.name;
    let lv=Math.max(1,num($('#p_lv').value,1));
    let exp=Math.max(0,num($('#p_exp').value,0));
    const next=Math.max(1,num($('#p_next').value,100));
    while(exp>=next){ exp-=next; lv+=1; }
    const o={};
    o[kidPath(currentId,'player')]={name:nm, level:lv, exp:exp, expToNext:next,
      money:Math.max(0,num($('#p_money').value,0))};
    o[P('profiles',currentId,'name')]=nm;
    addLog(o,currentId,'ステータスを変更');
    if(await push(o)) toast('保存しました');
    return;
  }
  if(act==='resetDaily'){
    const o={};
    db.tiles.forEach(t=>{ if(t.kind==='daily'){
      o[kidPath(currentId,'tiles',t.id,'completed')]=false;
      o[kidPath(currentId,'tiles',t.id,'pending')]=false; } });
    o[kidPath(currentId,'lastResetDate')]=new Date().toDateString();
    addLog(o,currentId,'日々タイルをリセット');
    if(await push(o)) toast('リセットしました');
    return;
  }
  if(act==='clearLog'){
    const o={}; o[kidPath(currentId,'logs')]=null;
    if(await push(o)) toast('りれきを消しました');
    return;
  }

  /* --- 見た目 --- */
  if(act==='saveSizes'){
    const o={};
    document.querySelectorAll('[data-sz]').forEach(inp=>{
      o[kidPath(currentId,'iconSize',inp.dataset.sz)]=Math.max(6,num(inp.value,DEFAULT_ICON_SIZE[inp.dataset.sz]));
    });
    addLog(o,currentId,'大きさを変更');
    if(await push(o)) toast('保存しました');
    return;
  }
  if(act==='resetSizes'){
    const o={}; o[kidPath(currentId,'iconSize')]=Object.assign({},DEFAULT_ICON_SIZE);
    addLog(o,currentId,'大きさを既定に戻す');
    if(await push(o)) toast('既定に戻しました');
    return;
  }
  if(act==='resetIcons'){
    if(!confirm('アイコンのパスを既定に戻します')) return;
    const o={}; o[kidPath(currentId,'icons')]=Object.assign({},DEFAULT_ICONS);
    addLog(o,currentId,'アイコンを既定に戻す');
    if(await push(o)) toast('既定に戻しました');
    return;
  }

  /* --- データ --- */
  if(act==='exportOne'){
    const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    download(currentId+'_backup.json', URL.createObjectURL(blob)); return;
  }
  if(act==='exportAll'){
    const all={};
    profiles.forEach(p=>{ all[p.id]=kidLocal(p.id); });
    const blob=new Blob([JSON.stringify(all,null,1)],{type:'application/json'});
    download('lifequest_all_backup.json', URL.createObjectURL(blob)); return;
  }
  if(act==='importOne'){
    let obj=null;
    try{ obj=JSON.parse($('#jsonBox').value); }catch(err){ toast('JSONが正しくありません',true); return; }
    if(!confirm(currentId+' のデータを、この内容で上書きします。よろしいですか？')) return;
    const o={}; o[kidPath(currentId)]=toCloudKid(obj);
    addLog(o,currentId,'データを読み込み');
    if(await push(o)) toast('読み込みました');
    return;
  }
  if(act==='wipeOne'){
    if(!confirm(currentId+' のデータを初期状態に戻します。よろしいですか？')) return;
    const o={}; o[kidPath(currentId)]=seedKid(currentId);
    if(await push(o)) toast('初期化しました');
    return;
  }
});

/* ================= タブ・セレクト ================= */
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); tab=b.dataset.tab; render(); window.scrollTo(0,0);
  };
});
$('#userSel').onchange=e=>{ if(!e.target.value) return; currentId=e.target.value; render(); };
$('#addBtn').onclick=addChild;

/* ================= 日付が変わったときの処理 ================= */
async function autoRollover(){
  if(rolling) return;
  rolling=true;
  try{
    const today=new Date().toDateString();
    for(const p of profiles.slice()){
      if(rolloverDone[p.id+today]) continue;
      if(!(cloud.profiles && cloud.profiles[p.id])) continue;   // 名簿に無い子は触らない
      const d=kidLocal(p.id);
      if(d.lastResetDate===today){ rolloverDone[p.id+today]=1; continue; }
      rolloverDone[p.id+today]=1;
      const o={};
      d.tiles.forEach(t=>{
        if(t.kind==='daily'){
          if(t.completed) o[kidPath(p.id,'tiles',t.id,'completed')]=false;
          if(t.pending)   o[kidPath(p.id,'tiles',t.id,'pending')]=false;
        }else if(t.completed && !t.archived){
          o[kidPath(p.id,'tiles',t.id,'archived')]=true;
        }
      });
      o[kidPath(p.id,'lastResetDate')]=today;
      await push(o);
    }
  } finally { rolling=false; }
}

/* ================= 起動 ================= */
function setConn(ok){
  connected=ok;
  const el=$('#connDot');
  el.className='dot '+(ok?'on':'off');
  $('#connTxt').textContent = ok?'オンライン':'オフライン';
}
function gate(){
  if(!PIN) return true;
  if(sessionStorage.getItem('lq_admin_ok')==='1') return true;
  const v=prompt('かんりしゃの暗証番号を入れてください');
  if(v===PIN){ sessionStorage.setItem('lq_admin_ok','1'); return true; }
  document.body.innerHTML='<div class="gate card"><h2>暗証番号がちがいます</h2>'
    +'<div class="hint">ページを再読み込みしてやり直してください。</div></div>';
  return false;
}
async function start(){
  if(!gate()) return;
  if(!CFG.projectId){ render(); setConn(false); return; }
  const app=initializeApp(CFG);
  const auth=getAuth(app);
  fdb=getFirestore(app);

  onAuthStateChanged(auth, u=>{
    if(!u) return;
    uidAuth=u.uid;
    if(subscribed) return;      // 購読は一度だけ（多重リスナー防止）
    subscribed=true;

    onSnapshot(collection(fdb, PROFILES), snap=>{
      setConn(true);
      cloud.profiles={};
      snap.forEach(d=>{ cloud.profiles[d.id]=d.data()||{}; });
      afterCloud();
    }, err=>{ cloud.profiles={}; afterCloud(); });

    onSnapshot(collection(fdb, KIDS), snap=>{
      setConn(true);
      cloud.db={};
      snap.forEach(d=>{ cloud.db[d.id]=d.data()||{}; });
      afterCloud();
    }, err=>{ cloud.db={}; afterCloud(); });

    /* ★ shared は購読しません。残骸の有無を一度だけ確認するだけです */
    checkLegacyShared();
  });

  try{ await signInAnonymously(auth); }
  catch(e){
    $('#view').innerHTML='<div class="card"><h2>ログインできませんでした</h2>'
      +'<div class="hint">'+esc(e.code||e.message)+'<br>'
      +'Firebase の Authentication で「匿名」を有効にし、承認済みドメインに '
      +'<code>'+esc(location.hostname)+'</code> を追加してください。</div></div>';
  }
}
function afterCloud(){
  loadProfiles();
  if(!profiles.length) seedBaseKidsOnce();
  if(!currentId) currentId = profiles.some(p=>p.id===adminLastId) ? adminLastId : (profiles[0]?profiles[0].id:null);
  if(currentId) adminLastId=currentId;
  scheduleRender();
  autoRollover();
}
setConn(false);
start();
</script>
